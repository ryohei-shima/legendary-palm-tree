<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>利用者情報の編集</title>
</head>
<body>
    <h1>利用者情報の編集・追記</h1>
    <form th:action="@{/users/{id}/update(id=${user.id})}" th:object="${user}" method="post">
        <!-- IDや名前など、変更しない（または隠して送る）大切なデータを配置 -->
        <input type="hidden" th:field="*{id}" />
        
        <div>
            <label>氏名：</label>
            <input type="text" th:field="*{name}" required />
        </div>
        <br>
        <div>
            <label>要介護度：</label>
            <select th:field="*{careLevel}">
                <option value="要支援1">要支援1</option>
                <option value="要支援2">要支援2</option>
                <option value="要介護1">要介護1</option>
                <option value="要介護2">要介護2</option>
                <option value="要介護3">要介護3</option>
                <option value="要介護4">要介護4</option>
                <option value="要介護5">要介護5</option>
            </select>
        </div>
        <br>
        <div>
            <label>次回計画書更新日：</label>
            <input type="date" th:field="*{nextUpdateDate}" required />
        </div>
        <br>
        <div>
            <label>既往歴：</label><br>
            <textarea th:field="*{medicalHistory}" rows="5" cols="40" placeholder="（例）右大腿骨頸部骨折（R5年）、高血圧"></textarea>
        </div>
        <br>
        <div>
            <label>禁忌・備考欄：</label><br>
            <textarea th:field="*{notes}" rows="5" cols="40" placeholder="（例）血圧160以上で負荷運動中止、左側からの声かけに配慮"></textarea>
        </div>
        <br>
        <button type="submit">変更を保存する</button>
    </form>
    <br>
    <a th:href="@{/users/{id}(id=${user.id})}">キャンセルして詳細に戻る</a>
	<td th:text="${user.id}">1</td>
	<td>
	    <!-- 名前をクリックすると詳細画面へ -->
	    <a th:href="@{/users/{id}(id=${user.id})}" th:text="${user.name}">山田 太郎</a>
	</td>
	<td th:text="${user.careLevel}">要介護2</td>
	<td th:text="${user.nextUpdateDate}">2026-11-30</td>
</body>
</html>
