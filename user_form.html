<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>利用者登録</title>
</head>
<body>
    <h1>新規利用者登録</h1>

    <!-- 同姓同名の注意メッセージ（重複時のみ赤字で表示） -->
    <div th:if="${warningMessage != null}" style="color: red; font-weight: bold; border: 1px solid red; padding: 10px; margin-bottom: 15px;">
        <p th:text="${warningMessage}" style="margin: 0;"></p>
    </div>

    <form th:action="@{/users}" th:object="${user}" method="post">
        <div>
            <label>氏名：</label>
            <input type="text" th:field="*{name}" required />
        </div>
        <br>
        <div>
            <label>生年月日：</label>
            <input type="date" th:field="*{birthDate}" required />
        </div>
        <br>
        <div>
            <label>要介護度：</label>
            <select th:field="*{careLevel}">
                <option value="要支援1">要支援1</option>
                <option value="要支援2">要支援2</option>
                <option value="要介護1">要介護1</option>
                <option value="要介護2">要介護2</option>
                <option value="要介護3">要介護3</option>
                <option value="要介護4">要介護4</option>
                <option value="要介護5">要介護5</option>
            </select>
        </div>
        <br>
        <div>
            <label>次回計画書更新日：</label>
            <input type="date" th:field="*{nextUpdateDate}" required />
        </div>
        <br>
        <div>
            <label>既往歴：</label><br>
            <textarea th:field="*{medicalHistory}" rows="3" cols="40"></textarea>
        </div>
        <br>
        <div>
            <label>禁忌・備考欄：</label><br>
            <textarea th:field="*{notes}" rows="3" cols="40"></textarea>
        </div>
        <br>
        <button type="submit">登録する</button>
    </form>
    <br>
    <a th:href="@{/users}">一覧に戻る</a>
</body>
</html>
